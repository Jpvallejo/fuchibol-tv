<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920" />
  <title>Argentina TV</title>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.compiled.js"></script>
  <script type="module" crossorigin src="./assets/index-DrOgtKM0.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CAInKSzq.css">
</head>
<body>
  <!-- Channel Grid Screen -->
  <div id="screen-grid" class="screen active">
    <header class="grid-header">
      <span class="app-title">Argentina TV</span>
      <button id="mundial-nav-btn" class="mundial-nav-btn">⚽ Mundial</button>
      <span class="live-dot-header">&#9679; EN VIVO</span>
    </header>

    <div id="channel-grid" class="channel-grid" role="grid" aria-label="Grilla de canales en vivo"></div>
  </div>

  <!-- Player Screen -->
  <div id="screen-player" class="screen">
    <video id="video" autoplay playsinline></video>

    <div id="loading-spinner" class="channel-loading" hidden>
      <div class="channel-loading-logo" id="loading-logo"></div>
      <div class="channel-loading-info">
        <span class="channel-loading-number" id="loading-number"></span>
        <span class="channel-loading-name" id="loading-name"></span>
      </div>
      <div class="channel-loading-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="error-overlay" class="error-overlay" hidden>
      <div class="error-box">
        <span class="error-icon">⚠</span>
        <p id="error-message">Error al cargar el canal</p>
      </div>
    </div>

    <div id="player-overlay" class="player-overlay">
      <div class="overlay-content">
        <span id="overlay-channel-number" class="overlay-channel-number"></span>
        <span id="overlay-channel-name" class="overlay-channel-name"></span>
        <span class="overlay-live-badge">&#9679; EN VIVO</span>
      </div>
    </div>

    <div id="guide-overlay" class="guide-overlay" hidden>
      <div class="guide-header">Guía de canales</div>
      <div id="guide-list" class="guide-list"></div>
    </div>
  </div>

  <!-- Mundial Screen -->
  <div id="screen-mundial" class="screen">
    <header class="mundial-header">
      <button id="mundial-back-btn" class="mundial-back-btn">← Volver</button>
      <span class="mundial-title">⚽ Mundial</span>
      <span></span>
    </header>
    <div id="mundial-content" class="mundial-content"></div>

    <!-- Substream picker overlay -->
    <div id="mundial-substream-overlay" class="mundial-substream-overlay" hidden>
      <div class="mundial-substream-panel">
        <div class="mundial-substream-title" id="mundial-substream-event-name"></div>
        <div class="mundial-substream-list" id="mundial-substream-list"></div>
      </div>
    </div>

    <!-- Iframe overlay -->
    <div id="mundial-iframe-overlay" class="mundial-iframe-overlay" hidden>
      <button id="mundial-iframe-close" class="mundial-iframe-close">✕ Cerrar</button>
      <iframe id="mundial-iframe" class="mundial-iframe" allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>
  </div>

  <div id="back-press-tooltip" class="back-press-tooltip" hidden>
    Presiona Back dos veces para salir
  </div>

  <!-- Initial loading screen shown until channels are ready -->
  <div id="grid-loading" class="grid-loading-overlay">
    <div class="grid-loading-content">
      <span class="grid-loading-title">Argentina TV</span>
      <div class="channel-loading-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

</body>
</html>
